  <style>
    :root { --bg:#1f1f1f; --panel:#242424; --panel2:#2a2a2a; --text:#eaeaea; --muted:#a8a8a8; --line:#3b3b3b; --green:#19c37d; --yellow:#f3c623; --orange:#f58220; --red:#e74c3c; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1320px; margin: 24px auto; padding: 0 16px 24px; }
    .card { background:#222; border:1px solid #2f2f2f; border-radius:10px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.3); }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
    h1 { margin:0; font-size:22px; }
    .total { border:2px solid var(--green); color:#6dffab; padding:10px 14px; border-radius:8px; font-weight:700; background:#102217; }
    .buttons, .filters, .addrow { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .buttons { margin-bottom:12px; }
    button, input, select { border:1px solid #454545; background:#2d2d2d; color:var(--text); border-radius:6px; padding:10px 12px; font-size:14px; }
    button { cursor:pointer; }
    .b1 { background:#8e44ad; } .b2 { background:#3e8ed0; } .b3 { background:#f1c40f; color:#222; } .b4 { background:#2ecc71; } .b5 { background:#e67e22; } .b6 { background:#95a5a6; color:#111; }
    .input { min-width: 120px; }
    .wide { min-width: 260px; }
    .small { width:76px; text-align:center; }
    .rowlabel { color:var(--muted); font-weight:700; margin-right:6px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:10px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th, td { border-bottom:1px solid #333; padding:9px 8px; text-align:left; white-space:nowrap; }
    th { color:#ddd; font-size:12px; background:#2a2a2a; position:sticky; top:0; }
    tbody tr:hover { background:#272727; }
    .muted { color:var(--muted); }
    .matchbox { max-height:220px; overflow:auto; margin-top:10px; border:1px solid #3a3a3a; border-radius:8px; background:#1f1f1f; }
    .matchitem { padding:10px 12px; border-bottom:1px solid #2d2d2d; cursor:pointer; }
    .matchitem:hover { background:#2a2a2a; }
    .actions button { padding:7px 10px; font-size:12px; margin-right:6px; }
    .edit { background:var(--yellow); color:#222; border:none; }
    .del { background:var(--red); border:none; }
    .check { background:#ffb000; color:#222; border:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <h1>Pokemon Inventory Management</h1>
        <div class="total" id="totalValue">Total Value: $0.00</div>
      </div>

      <div class="buttons">
        <button class="b1" id="uploadBtn">Upload Workbook</button>
        <button class="b2" type="button">Master Backup</button>
        <button class="b3" type="button">eBay Audit Export</button>
        <button class="b4" type="button">Refresh Live Prices</button>
        <button class="b5" type="button">Link &amp; Save Local File</button>
        <button class="b6" type="button">Wipe Data</button>
        <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
      </div>

      <div class="panel">
        <div class="addrow">
          <span class="rowlabel">Ref / SKU</span>
          <input class="input" id="sku" placeholder="Ref / SKU" />
          <select class="input wide" id="setField"></select>
          <input class="input wide" id="query" placeholder="2. Type No. or Name..." list="cardList" />
          <datalist id="cardList"></datalist>
          <input class="input small" id="loc" placeholder="Loc" />
          <input class="input small" id="qty" placeholder="1" value="1" />
          <button class="b4" id="addBtn">Add to Stock</button>
        </div>

        <div class="panel" style="margin-top:12px;">
          <div class="filters">
            <span class="rowlabel">Sort &amp; Filter:</span>
            <button id="sortBtn">Sort By: None</button>
            <input class="input" id="filterSku" placeholder="Ref / SKU" />
            <select id="filterSet"></select>
            <input class="input" id="filterCode" placeholder="Code" />
            <input class="input" id="filterName" placeholder="Name/No." />
            <input class="input" id="filterLoc" placeholder="Loc" />
            <input class="input" id="filterQty" placeholder="Qty" />
            <input class="input" id="filterUnit" placeholder="Unit $" />
            <button id="clearFilters">Clear</button>
          </div>
        </div>
      </div>

      <div class="muted" id="cardCount" style="margin:10px 0 6px;">0 cards in inventory</div>
      <div class="panel" style="padding:0; overflow:auto; max-height:60vh;">
        <table>
          <thead>
            <tr><th>Ref / SKU</th><th>Set</th><th>Code</th><th>No. &amp; Card Name</th><th>Location</th><th>Qty</th><th>Unit Val ($)</th><th>Total Val ($)</th><th>eBay Last Sold</th><th>Actions</th></tr>
          </thead>
          <tbody id="inventory"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  let indexData = [];
  const inventory = [];
  const els = {
    uploadBtn: document.getElementById('uploadBtn'), fileInput: document.getElementById('fileInput'), sku: document.getElementById('sku'), setField: document.getElementById('setField'), query: document.getElementById('query'), loc: document.getElementById('loc'), qty: document.getElementById('qty'), addBtn: document.getElementById('addBtn'), inventory: document.getElementById('inventory'), cardCount: document.getElementById('cardCount'), totalValue: document.getElementById('totalValue'), cardList: document.getElementById('cardList'), filterSet: document.getElementById('filterSet'), filterSku: document.getElementById('filterSku'), filterCode: document.getElementById('filterCode'), filterName: document.getElementById('filterName'), filterLoc: document.getElementById('filterLoc'), filterQty: document.getElementById('filterQty'), filterUnit: document.getElementById('filterUnit'), clearFilters: document.getElementById('clearFilters'), sortBtn: document.getElementById('sortBtn')
  };

  function normalize(s) { return String(s || '').trim().toLowerCase(); }
  function unitVal() { return 0; }
  function formatNum(v) { return String(v || '').replace(/^0+/, '') || '0'; }

  function buildSetOptions() {
    const sets = [...new Set(indexData.map(x => x.set).filter(Boolean))].sort();
    els.setField.innerHTML = sets.map(s => `<option value="${s}"></option>`).join('');
    els.filterSet.innerHTML = `<option value="All Sets">All Sets</option>` + sets.map(s => `<option value="${s}"></option>`).join('');
    if (sets.length && !els.setField.value) els.setField.value = sets[0];
  }

  function buildCardDatalist(setName = '') {
    const cards = indexData.filter(c => !setName || c.set === setName);
    els.cardList.innerHTML = cards.map(c => `<option value="${c.number} — ${c.name}"></option>`).join('');
  }

  function loadWorkbook(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const found = [];
      wb.SheetNames.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, blankrows: false });
        let headerRow = -1, setCol = -1, nameCol = -1;
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i].map(v => String(v || '').trim());
          const setIdx = row.findIndex(v => normalize(v) === 'set #' || normalize(v) === 'set#' || normalize(v) === 'number' || normalize(v) === 'no.' || normalize(v) === 'no' || normalize(v) === '#');
          const nameIdx = row.findIndex(v => normalize(v) === 'name' || normalize(v) === 'card name' || normalize(v) === 'pokemon name');
          if (setIdx >= 0 && nameIdx >= 0) { headerRow = i; setCol = setIdx; nameCol = nameIdx; break; }
        }
        if (headerRow >= 0) {
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i].map(v => String(v || '').trim());
            const num = row[setCol] || '';
            const name = row[nameCol] || '';
            if (/^\d+\/\d+$/.test(num) && name && normalize(name) !== 'name') {
              const [a,b] = num.split('/');
              found.push({ set: sheetName, number: `${String(+a).padStart(3,'0')}/${String(+b).padStart(3,'0')}`, name });
            }
          }
        }
      });
      indexData = found;
      buildSetOptions();
      buildCardDatalist(els.setField.value);
      alert(`Loaded ${indexData.length} cards from workbook sheets.`);
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  function lookupCard(q) {
    const x = normalize(q);
    return indexData.find(c => normalize(c.number).startsWith(x) || normalize(c.name).includes(x) || normalize(`${c.number} — ${c.name}`).includes(x));
  }

  function render() {
    const rows = inventory.filter(r => {
      const f = { sku: normalize(els.filterSku.value), set: normalize(els.filterSet.value), code: normalize(els.filterCode.value), name: normalize(els.filterName.value), loc: normalize(els.filterLoc.value), qty: normalize(els.filterQty.value), unit: normalize(els.filterUnit.value) };
      return (!f.sku || normalize(r.sku).includes(f.sku)) && (!f.set || f.set === 'all sets' || normalize(r.set).includes(f.set)) && (!f.code || normalize(r.code).includes(f.code)) && (!f.name || normalize(r.card).includes(f.name)) && (!f.loc || normalize(r.location).includes(f.loc)) && (!f.qty || String(r.qty).includes(f.qty)) && (!f.unit || String(r.unit).includes(f.unit));
    });
    els.inventory.innerHTML = rows.map(r => `
      <tr>
        <td>${r.sku}</td><td>${r.set}</td><td>${r.code}</td><td>${r.card}</td><td>${r.location}</td><td>${r.qty}</td><td>${r.unit.toFixed(2)}</td><td>${(r.qty*r.unit).toFixed(2)}</td><td><button class="check">Check</button></td><td class="actions"><button class="edit">Edit</button><button class="del">Delete</button></td>
      </tr>`).join('');
    els.cardCount.textContent = `${inventory.length} cards in inventory`;
    els.totalValue.textContent = `Total Value: $${inventory.reduce((a,b)=>a+b.qty*b.unit,0).toFixed(2)}`;
  }

  function addCard() {
    const picked = lookupCard(els.query.value);
    if (!picked) { alert('Card not found in workbook sheets.'); return; }
    const setName = els.setField.value || picked.set;
    inventory.unshift({ sku: els.sku.value || `ref-${String(inventory.length+1).padStart(3,'0')}`, set: setName, code: setName.split(' ').pop().replace(/[()]/g,'') || 'SI', card: `${picked.number} ${picked.name}`, location: els.loc.value || 'A', qty: Number(els.qty.value || 1), unit: unitVal(picked) });
    els.query.value = `${picked.number} — ${picked.name}`;
    render();
  }

  els.uploadBtn.addEventListener('click', () => els.fileInput.click());
  els.fileInput.addEventListener('change', e => { const file = e.target.files[0]; if (file) loadWorkbook(file); });
  els.addBtn.addEventListener('click', addCard);
  els.query.addEventListener('keydown', e => { if (e.key === 'Enter') addCard(); });
  els.setField.addEventListener('change', () => buildCardDatalist(els.setField.value));
  [els.filterSku, els.filterSet, els.filterCode, els.filterName, els.filterLoc, els.filterQty, els.filterUnit].forEach(el => el.addEventListener('input', render));
  els.clearFilters.addEventListener('click', () => { [els.filterSku, els.filterCode, els.filterName, els.filterLoc, els.filterQty, els.filterUnit].forEach(el => el.value=''); els.filterSet.value='All Sets'; render(); });
  els.sortBtn.addEventListener('click', () => alert('Sort control preserved for your existing layout.'));

  render();
</script>
</body>
</html>
