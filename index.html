<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Inventory Management</title>
    
    <script src="pokemon_database.js" onerror="console.warn('External DB not found, loading Core DB only.')"></script>

    <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js" charset="UTF-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* ── Base Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 40px; background-color: #121212; color: #e0e0e0; }

        /* ── Layout ── */
        .container { max-width: 1400px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h2 { color: #ffffff; margin: 0; }

        /* ── Portfolio Value ── */
        .portfolio-value { background-color: #000; color: #2ecc71; padding: 10px 20px; border-radius: 8px; font-size: 24px; font-weight: bold; border: 2px solid #2ecc71; }

        /* ── Buttons ── */
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: filter 0.15s, opacity 0.15s; }
        .btn:hover { filter: brightness(1.15); }
        .btn:active { filter: brightness(0.9); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
        .btn-upload  { background-color: #8e44ad; color: #fff; }
        .btn-download{ background-color: #2980b9; color: #fff; }
        .btn-audit   { background-color: #f1c40f; color: #2c3e50; }
        .btn-price   { background-color: #2ecc71; color: #2c3e50; box-shadow: 0 0 10px rgba(46,204,113,0.2); }
        .btn-link-save { background-color: #d35400; color: #fff; }
        .btn-clear   { background-color: #7f8c8d; color: #fff; }
        .btn-build-db{ background-color: #d35400; color: #fff; }
        .btn-add     { background-color: #27ae60; color: #fff; padding: 0 20px; height: 40px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: filter 0.15s; }
        .btn-add:hover { filter: brightness(1.15); }
        .btn-cancel  { background-color: #e74c3c; color: #fff; padding: 0 20px; height: 40px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; display: none; transition: filter 0.15s; }
        .btn-cancel:hover { filter: brightness(1.15); }
        .btn-edit    { background-color: #f39c12; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: filter 0.15s; }
        .btn-edit:hover { filter: brightness(1.15); }
        .btn-delete  { background-color: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: filter 0.15s; }
        .btn-delete:hover { filter: brightness(1.15); }
        .btn-clear-filters { background-color: #7f8c8d; color: #fff; border: none; padding: 0 15px; height: 40px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: filter 0.15s; }
        .btn-clear-filters:hover { filter: brightness(1.15); }

        /* ── Inputs ── */
        input, select {
            height: 40px; border: 1px solid #444; border-radius: 6px;
            padding: 0 10px; box-sizing: border-box;
            background-color: #2d2d2d; color: #fff; font-size: 14px;
        }
        input::placeholder { color: #999; }
        input:focus, select:focus { outline: none; border-color: #3498db; }
