  <style>
    body { margin:0; background:#1f1f1f; color:#eaeaea; font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1320px; margin: 24px auto; padding: 0 16px 24px; }
    .card { background:#222; border:1px solid #2f2f2f; border-radius:10px; padding:18px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
    h1 { margin:0; font-size:22px; }
    .total { border:2px solid #19c37d; color:#6dffab; padding:10px 14px; border-radius:8px; font-weight:700; }
    .buttons, .filters, .addrow { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    button, input, select { border:1px solid #454545; background:#2d2d2d; color:#eaeaea; border-radius:6px; padding:10px 12px; font-size:14px; }
    button { cursor:pointer; }
    .b1 { background:#8e44ad; } .b2 { background:#3e8ed0; } .b3 { background:#f1c40f; color:#222; } .b4 { background:#2ecc71; } .b5 { background:#e67e22; } .b6 { background:#95a5a6; color:#111; }
    .input { min-width: 120px; }
    .wide { min-width: 260px; }
    .small { width:76px; text-align:center; }
    .panel { background:#242424; border:1px solid #3b3b3b; border-radius:8px; padding:12px; margin-top:10px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th, td { border-bottom:1px solid #333; padding:9px 8px; text-align:left; white-space:nowrap; }
    th { background:#2a2a2a; position:sticky; top:0; }
    .muted { color:#a8a8a8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <h1>Pokemon Inventory Management</h1>
        <div class="total" id="totalValue">Total Value: $0.00</div>
      </div>
      <div class="buttons">
        <button class="b1" id="uploadBtn">Upload Workbook</button>
        <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
      </div>
      <div class="panel">
        <div class="addrow">
          <input class="input" id="sku" placeholder="Ref / SKU" />
          <select class="input wide" id="setField"></select>
          <input class="input wide" id="query" placeholder="Type No. or Name..." list="cardList" />
          <datalist id="cardList"></datalist>
          <input class="input small" id="loc" placeholder="Loc" />
          <input class="input small" id="qty" placeholder="1" value="1" />
          <button class="b4" id="addBtn">Add to Stock</button>
        </div>
      </div>
      <div class="muted" id="cardCount" style="margin:10px 0 6px;">0 cards in inventory</div>
      <div class="panel" style="padding:0; overflow:auto; max-height:60vh;">
        <table>
          <thead><tr><th>Ref / SKU</th><th>Set</th><th>Code</th><th>No. &amp; Card Name</th><th>Location</th><th>Qty</th></tr></thead>
          <tbody id="inventory"></tbody>
        </table>
      </div>
    </div>
  </div>
<script>
let indexData = [];
let inventory = [];
const el = id => document.getElementById(id);
const ui = {uploadBtn:el('uploadBtn'), fileInput:el('fileInput'), sku:el('sku'), setField:el('setField'), query:el('query'), loc:el('loc'), qty:el('qty'), addBtn:el('addBtn'), inventory:el('inventory'), cardCount:el('cardCount'), totalValue:el('totalValue'), cardList:el('cardList')};
function normalize(s){return String(s||'').trim().toLowerCase();}
function formatNo(v){const m=String(v||'').trim().match(/^(\d+)\/(\d+)$/); if(!m)return ''; return `${m[1].padStart(3,'0')}/${m[2].padStart(3,'0')}`;}
function parseWorkbook(file){const r=new FileReader(); r.onload=e=>{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const found=[]; wb.SheetNames.forEach(sheet=>{const ws=wb.Sheets[sheet]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,blankrows:false}); let header=-1, setCol=-1, nameCol=-1; for(let i=0;i<rows.length;i++){const row=rows[i].map(v=>String(v||'').trim()); const a=row.findIndex(v=>normalize(v)==='set #'||normalize(v)==='set#'); const b=row.findIndex(v=>normalize(v)==='name'); if(a>=0&&b>=0){header=i; setCol=a; nameCol=b; break;}} if(header>=0){for(let i=header+1;i<rows.length;i++){const row=rows[i].map(v=>String(v||'').trim()); const num=formatNo(row[setCol]); const name=row[nameCol]; if(num && name && normalize(name)!=='name') found.push({set:sheet, number:num, name});}}}); indexData=found; if(!indexData.length){alert('No card rows were found. Please check that each sheet has Set # and Name columns.'); return;} ui.setField.innerHTML=[...new Set(indexData.map(x=>x.set))].map(s=>`<option value="${s}"></option>`).join(''); ui.setField.value=indexData[0].set; ui.cardList.innerHTML=indexData.map(c=>`<option value="${c.number} — ${c.name}"></option>`).join(''); alert(`Loaded ${indexData.length} cards from workbook.`); render();}; r.readAsArrayBuffer(file);} 
function lookup(q){const x=normalize(q); return indexData.find(c=>normalize(c.number)===x||normalize(c.name)===x||normalize(`${c.number} — ${c.name}`).includes(x));}
function add(){const card=lookup(ui.query.value); if(!card){alert('Card not found.'); return;} inventory.unshift({sku:ui.sku.value||`ref-${String(inventory.length+1).padStart(3,'0')}`, set:ui.setField.value||card.set, code:card.set, card:`${card.number} ${card.name}`, location:ui.loc.value||'A', qty:Number(ui.qty.value||1)}); ui.query.value=`${card.number} — ${card.name}`; render();}
function render(){ui.inventory.innerHTML=inventory.map(r=>`<tr><td>${r.sku}</td><td>${r.set}</td><td>${r.code}</td><td>${r.card}</td><td>${r.location}</td><td>${r.qty}</td></tr>`).join(''); ui.cardCount.textContent=`${inventory.length} cards in inventory`; ui.totalValue.textContent='Total Value: $0.00';}
ui.uploadBtn.onclick=()=>ui.fileInput.click(); ui.fileInput.onchange=e=>e.target.files[0]&&parseWorkbook(e.target.files[0]); ui.addBtn.onclick=add; ui.query.onkeydown=e=>{if(e.key==='Enter') add();}; render();
</script>
</body>
</html>
