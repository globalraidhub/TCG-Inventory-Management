<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Inventory Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { font-family: system-ui, sans-serif; padding: 40px; background-color: #f4f7f6; }
        .container { max-width: 1250px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        
        .action-buttons { display: flex; gap: 10px; }
        .btn-upload { background-color: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-download { background-color: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-audit { background-color: #f1c40f; color: #2c3e50; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-clear { background-color: #7f8c8d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .inventory-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; margin-top: 20px; background: #fdfdfd; padding: 15px; border: 1px solid #eee; border-radius: 8px;}
        input, select { height: 40px; border: 1px solid #ddd; border-radius: 6px; padding: 0 10px; box-sizing: border-box;}
        
        .btn-add { background-color: #27ae60; color: white; border: none; padding: 0 20px; height: 40px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-add:hover { background-color: #219150; }
        .btn-cancel { background-color: #e74c3c; color: white; border: none; padding: 0 20px; height: 40px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }
        
        .filter-section { display: flex; gap: 10px; align-items: center; background-color: #e8f4f8; padding: 15px; border-radius: 8px; border: 1px solid #d1e5eb; margin-bottom: 10px; }
        .btn-clear-filters { background-color: #95a5a6; color: white; border: none; padding: 0 15px; height: 40px; border-radius: 6px; cursor: pointer; font-weight: bold;}

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn-edit { background-color: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        Pokemon Inventory Management
        <div class="action-buttons">
            <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
            <button class="btn-upload" onclick="document.getElementById('csv-file-input').click()">Upload CSV</button>
            <button class="btn-download" onclick="downloadCSV()">Master Backup</button>
            <button class="btn-audit" onclick="downloadEbayAudit()">eBay Audit Export</button>
            <button class="btn-clear" onclick="clearAllData()">Wipe Data</button>
        </div>
    </h2>
    
    <div class="inventory-row">
        <input type="text" id="input-ref" placeholder="Ref / SKU" style="width: 100px;">
        
        <input list="set-options" id="input-set" placeholder="1. Type Set Name..." style="width: 250px;">
        <datalist id="set-options"></datalist>
        
        <input type="text" id="input-code" placeholder="Code" style="width: 70px;">

        <input list="card-options" type="text" id="input-name" placeholder="2. Type No. (e.g. 025)..." style="width: 250px;">
        <datalist id="card-options"></datalist>
        
        <input type="text" id="input-location" placeholder="Location" style="width: 100px;">
        <input type="number" id="input-qty" value="1" style="width: 60px;" min="1">
        
        <button class="btn-add" id="main-action-btn" onclick="addFromUI()">Add to Stock</button>
        <button class="btn-cancel" id="cancel-edit-btn" onclick="cancelEdit()">Cancel Edit</button>
    </div>

    <div class="filter-section">
        <strong>Filter Inventory:</strong>
        <input type="text" id="filter-text" placeholder="Search Card Name, Ref, or Code..." style="flex: 1;">
        <select id="filter-set" style="width: 250px;">
            <option value="">All Sets (No Filter)</option>
        </select>
        <button class="btn-clear-filters" onclick="clearFilters()">Clear Filters</button>
    </div>

    <table id="inventory-table">
        <thead>
            <tr>
                <th>Ref / SKU</th>
                <th>Set</th>
                <th>Code</th>
                <th>No. & Card Name</th>
                <th>Location</th>
                <th>Qty</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    // Complete 86-Set Multilingual Dataset
    const database = [
        { id: "CRI", text: "Chaos Rising (EN: CRI)" }, { id: "M4", text: "Ninja Spinner (JP: M4)" }, { id: "CM4", text: "Ninja Spinner (CH: CM4)" }, { id: "KM4", text: "Ninja Spinner (KR: KM4)" },
        { id: "PFO", text: "Perfect Order (EN: PFO)" }, { id: "M3", text: "Nihil Zero (JP: M3)" }, { id: "CM3", text: "Nihil Zero (CH: CM3)" }, { id: "KM3", text: "Nihil Zero (KR: KM3)" },
        { id: "ASH", text: "Ascended Heroes (EN: ASH)" }, { id: "M2a", text: "Mega Symphonia (JP: M2a)" }, { id: "CM2a", text: "Mega Symphonia (CH: CM2a)" }, { id: "KM2a", text: "Mega Symphonia (KR: KM2a)" },
        { id: "M2A", text: "Mega Dream ex (JP: M2A)" }, { id: "CM2A", text: "Mega Dream ex (CH: CM2A)" }, { id: "KM2A", text: "Mega Dream ex (KR: KM2A)" },
        { id: "PHF", text: "Phantasmal Flames (EN: PHF)" }, { id: "M2", text: "Inferno X (JP: M2)" }, { id: "CM2", text: "Inferno X (CH: CM2)" }, { id: "KM2", text: "Inferno X (KR: KM2)" },
        { id: "MEG", text: "Mega Evolution (EN: MEG)" }, { id: "M1", text: "Mega Evolution (JP: M1)" }, { id: "CM1", text: "Mega Evolution (CH: CM1)" }, { id: "KM1", text: "Mega Evolution (KR: KM1)" },
        { id: "SV10", text: "Glory of Team Rocket (JP: SV10)" }, { id: "CSV10", text: "Glory of Team Rocket (CH: CSV10)" }, { id: "KS10", text: "Glory of Team Rocket (KR: KS10)" },
        { id: "BLB", text: "Black Bolt (EN: BLB)" }, { id: "SV8.5", text: "Black Bolt (JP: SV8.5)" }, { id: "CSV8", text: "Black Bolt (CH: CSV8)" }, { id: "KS8", text: "Black Bolt (KR: KS8)" },
        { id: "WHF", text: "White Flare (EN: WHF)" }, { id: "SV8", text: "White Flare (JP: SV8)" }, { id: "CSV7", text: "White Flare (CH: CSV7)" }, { id: "KS7", text: "White Flare (KR: KS7)" },
        { id: "DRI", text: "Destined Rivals (EN: DRI)" }, { id: "SV8.5", text: "Terastal Festival (JP: SV8.5)" }, { id: "CSV6", text: "Terastal Festival (CH: CSV6)" }, { id: "KS6", text: "Terastal Festival (KR: KS6)" },
        { id: "JTG", text: "Journey Together (EN: JTG)" }, { id: "SV8", text: "Super Electric Breaker (JP: SV8)" }, { id: "CSV5", text: "Super Electric Breaker (CH: CSV5)" }, { id: "KS5", text: "Super Electric Breaker (KR: KS5)" },
        { id: "PRE", text: "Prismatic Evolutions (EN: PRE)" }, { id: "SV7.5", text: "Terastal Dream (JP: SV7.5)" }, { id: "CSV4", text: "Terastal Dream (CH: CSV4)" }, { id: "KS4", text: "Terastal Dream (KR: KS4)" },
        { id: "SV08", text: "Surging Sparks (EN: SV08)" }, { id: "SV7", text: "Paradise Dragona (JP: SV7)" }, { id: "CSV3", text: "Paradise Dragona (CH: CSV3)" }, { id: "KS3", text: "Paradise Dragona (KR: KS3)" },
        { id: "SCR", text: "Stellar Crown (EN: SCR)" }, { id: "SV6.5", text: "Stellar Miracle (JP: SV6.5)" }, { id: "CSV2", text: "Stellar Miracle (CH: CSV2)" }, { id: "KS2", text: "Stellar Miracle (KR: KS2)" },
        { id: "SFA", text: "Shrouded Fable (EN: SFA)" }, { id: "SV6", text: "Night Wanderer (JP: SV6)" }, { id: "CSV1", text: "Night Wanderer (CH: CSV1)" }, { id: "KS1", text: "Night Wanderer (KR: KS1)" },
        { id: "TWM", text: "Twilight Masquerade (EN: TWM)" }, { id: "SV6", text: "Mask of Change (JP: SV6)" }, { id: "CS-SV6", text: "Mask of Change (CH: CS-SV6)" }, { id: "KS-SV6", text: "Mask of Change (KR: KS-SV6)" },
        { id: "TEF", text: "Temporal Forces (EN: TEF)" }, { id: "SV4", text: "Cyber Judge (JP: SV4)" }, { id: "CS-SV5", text: "Cyber Judge (CH: CS-SV5)" }, { id: "KS-SV5", text: "Cyber Judge (KR: KS-SV5)" },
        { id: "PAF", text: "Paldean Fates (EN: PAF)" }, { id: "SV4a", text: "Shiny Treasure ex (JP: SV4a)" }, { id: "CS-SV4.5", text: "Shiny Treasure ex (CH: CS-SV4.5)" }, { id: "KS-SV4.5", text: "Shiny Treasure ex (KR: KS-SV4.5)" },
        { id: "PAR", text: "Paradox Rift (EN: PAR)" }, { id: "SV3.5", text: "Ancient Roar (JP: SV3.5)" }, { id: "CS-SV4", text: "Ancient Roar (CH: CS-SV4)" }, { id: "KS-SV4", text: "Ancient Roar (KR: KS-SV4)" },
        { id: "MEW", text: "Pokémon 151 (EN: MEW)" }, { id: "SV2a", text: "Pokémon Card 151 (JP: SV2a)" }, { id: "CS-SV151", text: "Pokémon Card 151 (CH: CS-SV151)" }, { id: "KS-SV151", text: "Pokémon Card 151 (KR: KS-SV151)" },
        { id: "OBF", text: "Obsidian Flames (EN: OBF)" }, { id: "SV3", text: "Ruler of the Black Flame (JP: SV3)" }, { id: "CS-SV3", text: "Ruler of the Black Flame (CH: CS-SV3)" }, { id: "KS-SV3", text: "Ruler of the Black Flame (KR: KS-SV3)" },
        { id: "PAL", text: "Paldea Evolved (EN: PAL)" }, { id: "SV2", text: "Clay Burst (JP: SV2)" }, { id: "CS-SV2", text: "Clay Burst (CH: CS-SV2)" }, { id: "KS-SV2", text: "Clay Burst (KR: KS-SV2)" }
    ];

    let rowBeingEdited = null; 

    // --- SETUP DATALISTS AND DROPDOWNS ---
    const setDatalist = document.getElementById('set-options');
    const filterSetDropdown = document.getElementById('filter-set');
    
    database.forEach(item => {
        let option1 = document.createElement('option');
        option1.value = item.text;
        setDatalist.appendChild(option1);

        let option2 = document.createElement('option');
        option2.value = item.text;
        option2.innerText = item.text;
        filterSetDropdown.appendChild(option2);
    });

    // --- KEYBOARD SHORTCUTS ---
    document.getElementById('input-location').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); 
            addFromUI();
        }
    });

    document.getElementById('input-qty').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); 
            addFromUI();
        }
    });

    // --- FILTERING LOGIC ---
    function applyFilters() {
        const searchText = document.getElementById('filter-text').value.toLowerCase();
        const setFilter = document.getElementById('filter-set').value;
        const rows = document.querySelectorAll("#inventory-table tbody tr");

        rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            if (cells.length < 6) return;
            
            const ref = cells[0].innerText.toLowerCase();
            const set = cells[1].innerText;
            const code = cells[2].innerText.toLowerCase();
            const name = cells[3].innerText.toLowerCase();
            
            const matchesText = searchText === "" || name.includes(searchText) || ref.includes(searchText) || code.includes(searchText);
            const matchesSet = setFilter === "" || set === setFilter;
            
            if (matchesText && matchesSet) {
                row.style.display = ""; 
            } else {
                row.style.display = "none"; 
            }
        });
    }

    function clearFilters() {
        document.getElementById('filter-text').value = '';
        document.getElementById('filter-set').value = '';
        applyFilters(); 
    }

    document.getElementById('filter-text').addEventListener('input', applyFilters);
    document.getElementById('filter-set').addEventListener('change', applyFilters);

    // --- API FETCH LOGIC & FIREWALL ---
    document.getElementById('input-set').addEventListener('input', function() {
        const typedValue = this.value;
        const matchedItem = database.find(item => item.text === typedValue);
        const cardDatalist = document.getElementById('card-options');
        const nameInput = document.getElementById('input-name');
        
        if (matchedItem) {
            document.getElementById('input-code').value = matchedItem.id;
            
            // INSTANT NUMBER GENERATOR
            cardDatalist.innerHTML = '';
            for (let i = 1; i <= 300; i++) {
                let numStr = String(i).padStart(3, '0');
                let option = document.createElement('option');
                option.value = numStr; 
                cardDatalist.appendChild(option);
            }
            nameInput.placeholder = "2. Type No. (e.g. 025)...";
            
            // THE FIREWALL: Only ask API for English sets
            const isEnglish = matchedItem.text.includes("(EN:");
            
            if (isEnglish) {
                const baseName = matchedItem.text.split(" (")[0];
                fetch(`https://api.pokemontcg.io/v2/cards?q=set.name:"${baseName}"&pageSize=300`)
                    .then(r => r.json())
                    .then(d => {
                        if (d.data && d.data.length > 0) {
                            cardDatalist.innerHTML = ''; 
                            d.data.sort((a,b) => a.number - b.number).forEach(card => {
                                let option = document.createElement('option');
                                option.value = `${String(card.number).padStart(3, '0')} - ${card.name}`;
                                cardDatalist.appendChild(option);
                            });
                            nameInput.placeholder = "2. Type No. or Name...";
                        }
                    }).catch(() => {});
            }
        } else {
            document.getElementById('input-code').value = ''; 
            cardDatalist.innerHTML = '';
            nameInput.placeholder = "2. Type No. (e.g. 025)...";
        }
    });

    // --- SECURE DATA STORAGE ---
    function saveToLocalStorage() {
        let inventoryData = [];
        const rows = document.querySelectorAll("#inventory-table tbody tr");
        rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            inventoryData.push({ ref: cells[0].innerText, set: cells[1].innerText, code: cells[2].innerText, name: cells[3].innerText, loc: cells[4].innerText, qty: cells[5].innerText });
        });
        localStorage.setItem('pokemonInventory', JSON.stringify(inventoryData));
    }

    function loadFromLocalStorage() {
        const savedData = localStorage.getItem('pokemonInventory');
        if (savedData) {
            localStorage.setItem('pokemonInventory_backup', savedData);
            const inventoryData = JSON.parse(savedData);
            inventoryData.forEach(item => addRow(item.ref, item.set, item.code, item.name, item.loc, item.qty, false));
            applyFilters(); 
        }
    }
    document.addEventListener("DOMContentLoaded", loadFromLocalStorage);

    // --- SECURE ADD & EDIT FUNCTIONS ---
    function addRow(ref, set, code, name, loc, qty, triggerSave = true) {
        const tbody = document.querySelector("#inventory-table tbody");
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${ref}</td><td>${set}</td><td>${code}</td><td>${name}</td><td>${loc}</td><td>${qty}</td>
            <td>
                <button class="btn-edit" onclick="editRow(this)">Edit</button>
                <button class="btn-delete" onclick="deleteRow(this)">Del</button>
            </td>
        `;
        tbody.appendChild(tr);
        if (triggerSave) saveToLocalStorage();
        applyFilters(); 
    }

    function addFromUI() {
        const ref = document.getElementById('input-ref').value.trim();
        const set = document.getElementById('input-set').value;
        const code = document.getElementById('input-code').value;
        const name = document.getElementById('input-name').value;
        const loc = document.getElementById('input-location').value;
        const qty = document.getElementById('input-qty').value;

        if (!name || !set) { alert("Please specify the Set and Card Name/Number."); return; }

        // ANTI-DUPLICATE SKU CHECK
        if (ref !== "") {
            const rows = document.querySelectorAll("#inventory-table tbody tr");
            for (let row of rows) {
                if (row === rowBeingEdited) continue; // Ignore the row currently being edited
                
                const cells = row.querySelectorAll("td");
                if (cells[0].innerText === ref) {
                    if (rowBeingEdited) {
                        alert(`Cannot save: The Ref / SKU "${ref}" is already assigned to another card in your inventory.`);
                        return; // Prevent saving the edit
                    } else {
                        // Auto-merge quantity
                        const currentQty = parseInt(cells[5].innerText) || 0;
                        const addedQty = parseInt(qty) || 1;
                        cells[5].innerText = currentQty + addedQty;
                        
                        alert(`Ref / SKU "${ref}" already exists! The quantity has been increased by ${addedQty}.`);
                        clearInputs();
                        saveToLocalStorage();
                        applyFilters();
                        return; // Stop execution, do not add a new row
                    }
                }
            }
        }

        if (rowBeingEdited) {
            const cells = rowBeingEdited.querySelectorAll("td");
            cells[0].innerText = ref; cells[1].innerText = set; cells[2].innerText = code;
            cells[3].innerText = name; cells[4].innerText = loc; cells[5].innerText = qty;
            
            cancelEdit();
            saveToLocalStorage();
            applyFilters(); 
        } else {
            addRow(ref, set, code, name, loc, qty);
            clearInputs();
        }
    }

    function editRow(btn) {
        rowBeingEdited = btn.closest("tr");
        const cells = rowBeingEdited.querySelectorAll("td");
        
        document.getElementById('input-ref').value = cells[0].innerText;
        document.getElementById('input-set').value = cells[1].innerText;
        document.getElementById('input-code').value = cells[2].innerText;
        document.getElementById('input-name').value = cells[3].innerText;
        document.getElementById('input-location').value = cells[4].innerText;
        document.getElementById('input-qty').value = cells[5].innerText;
        
        const addBtn = document.getElementById('main-action-btn');
        addBtn.innerText = "Save Edit";
        addBtn.style.backgroundColor = "#f39c12"; 
        document.getElementById('cancel-edit-btn').style.display = "inline-block";
    }

    function cancelEdit() {
        rowBeingEdited = null;
        const addBtn = document.getElementById('main-action-btn');
        addBtn.innerText = "Add to Stock";
        addBtn.style.backgroundColor = "#27ae60"; 
        document.getElementById('cancel-edit-btn').style.display = "none";
        clearInputs();
    }

    function clearInputs() {
        document.getElementById('input-ref').value = ''; document.getElementById('input-set').value = '';
        document.getElementById('input-code').value = ''; document.getElementById('input-name').value = '';
        document.getElementById('input-location').value = ''; document.getElementById('input-qty').value = 1; 
        document.getElementById('card-options').innerHTML = ''; 
        
        // Put the cursor back to the first box ready for the next entry
        document.getElementById('input-ref').focus();
    }

    // --- SECURE DELETE FUNCTIONS ---
    function deleteRow(btn) { 
        const row = btn.closest("tr");
        const cardName = row.querySelectorAll("td")[3].innerText; 
        
        if(confirm(`Are you sure you want to delete this specific card?\n\n${cardName}`)) {
            row.remove(); 
            saveToLocalStorage(); 
        }
    }

    function clearAllData() {
        const securityCheck = prompt("WARNING: This will permanently wipe all data from your table.\n\nTo proceed, please type the word DELETE in the box below:");
        
        if(securityCheck === "DELETE") {
            document.querySelector("#inventory-table tbody").innerHTML = '';
            localStorage.removeItem('pokemonInventory');
            alert("All data has been successfully deleted.");
        } else if (securityCheck !== null) {
            alert("Wipe cancelled. Your data is perfectly safe.");
        }
    }

    // --- CSV FUNCTIONS ---
    
    // Master Backup Export
    function downloadCSV() {
        let csvData = [];
        document.querySelectorAll("#inventory-table tr").forEach(row => {
            let cols = row.querySelectorAll("td, th");
            let rowData = [];
            for (let i = 0; i < cols.length - 1; i++) { rowData.push('"' + cols[i].innerText.replace(/"/g, '""') + '"'); }
            csvData.push(rowData.join(","));
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csvData.join("\n")], { type: "text/csv" }));
        link.download = "Pokemon_Inventory_Master.csv";
        link.click();
    }
    
    // eBay Audit Export
    function downloadEbayAudit() {
        let csvData = [];
        
        // Setup eBay-specific headers
        csvData.push('"Custom Label (SKU)","Card Name","Set","Quantity"');

        // Extract specific columns for active inventory
        document.querySelectorAll("#inventory-table tbody tr").forEach(row => {
            let cells = row.querySelectorAll("td");
            if(cells.length > 0) {
                // Formatting specifically to match eBay active listing reports
                let sku = '"' + cells[0].innerText.replace(/"/g, '""') + '"';
                let set = '"' + cells[1].innerText.replace(/"/g, '""') + '"';
                let name = '"' + cells[3].innerText.replace(/"/g, '""') + '"';
                let qty = '"' + cells[5].innerText.replace(/"/g, '""') + '"';
                
                csvData.push([sku, name, set, qty].join(","));
            }
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csvData.join("\n")], { type: "text/csv" }));
        link.download = "eBay_Audit_List.csv";
        link.click();
    }

    document.getElementById('csv-file-input').addEventListener('change', function(e) {
        if (!e.target.files[0]) return;
        Papa.parse(e.target.files[0], {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => addRow(row["Ref / SKU"] || "", row["Set"] || "", row["Code"] || "", row["No. & Card Name"] || row["Card Name & No."] || "", row["Location"] || "", row["Qty"] || "1", false));
                saveToLocalStorage(); 
                applyFilters();
            }
        });
        e.target.value = ''; 
    });
</script>
</body>
</html>
