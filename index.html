<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Inventory Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #121212; color: #e0e0e0; }
        .container { max-width: 1200px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { padding: 10px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 4px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <input type="text" id="input-ref" placeholder="Ref">
        <input list="set-options" id="input-set" placeholder="Set Name">
        <datalist id="set-options"></datalist>
        <input type="text" id="input-code" placeholder="Code">
        <input list="card-options" type="text" id="input-name" placeholder="Name/No.">
        <datalist id="card-options"></datalist>
        <input type="text" id="input-location" placeholder="Loc">
        <input type="number" id="input-qty" value="1" style="width: 50px;">
        <button class="btn-add" onclick="addFromUI()">Add to Stock</button>
        <button onclick="localStorage.clear(); location.reload();">Wipe Data</button>
    </div>
    <table id="inventory-table">
        <thead><tr><th>Ref</th><th>Set</th><th>Code</th><th>Name</th><th>Loc</th><th>Qty</th><th>Actions</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const database = [
        { id: "CRI", text: "Chaos Rising (EN: CRI)", total: "086" },
        { id: "POR", text: "Perfect Order (EN: POR)", total: "088" },
        { id: "ASC", text: "Ascended Heroes (EN: ASC)", total: "217" },
        { id: "PFL", text: "Phantasmal Flames (EN: PFL)", total: "130" },
        { id: "MEG", text: "Mega Evolution (EN: MEG)", total: "132" },
        { id: "BLB", text: "Black Bolt (EN: BLB)", total: "80" },
        { id: "WHF", text: "White Flare (EN: WHF)", total: "106" },
        { id: "DRI", text: "Destined Rivals (EN: DRI)", total: "182" },
        { id: "JTG", text: "Journey Together (EN: JTG)", total: "143" },
        { id: "PRE", text: "Prismatic Evolutions (EN: PRE)", total: "175" },
        { id: "SSP", text: "Surging Sparks (EN: SSP)", total: "191" },
        { id: "M2A", text: "Mega Dream ex (JP: M2A)", total: "193" }
    ];

    const setDatalist = document.getElementById('set-options');
    database.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item.text;
        setDatalist.appendChild(opt);
    });

    document.getElementById('input-set').addEventListener('input', function() {
        const match = database.find(i => i.text.toLowerCase() === this.value.toLowerCase());
        if (match) document.getElementById('input-code').value = match.id;
    });

    function addRow(ref, set, code, name, loc, qty) {
        const tbody = document.querySelector("tbody");
        const row = document.createElement("tr");
        
        // Auto-format name if match exists
        const match = database.find(i => i.id.toLowerCase() === (code||"").toLowerCase() || i.text.includes(set));
        let display = name;
        if(match && match.total && !name.includes('/')) {
            const num = name.match(/^\d+/);
            if(num) display = `${num[0].padStart(3,'0')}/${match.total} ${name.replace(num[0],'').trim()}`;
        }

        row.innerHTML = `<td>${ref}</td><td>${set}</td><td>${code}</td><td>${display}</td><td>${loc}</td><td>${qty}</td><td><button onclick="this.closest('tr').remove(); save();">Del</button></td>`;
        tbody.prepend(row);
    }

    function addFromUI() {
        const ref = document.getElementById('input-ref').value;
        const set = document.getElementById('input-set').value;
        const code = document.getElementById('input-code').value;
        const name = document.getElementById('input-name').value;
        const qty = document.getElementById('input-qty').value;
        let loc = document.getElementById('input-location').value || (set.includes("(EN:") ? "B" : "A");

        addRow(ref, set, code, name, loc, qty);
        save();
    }

    function save() { localStorage.setItem('inv', document.querySelector("tbody").innerHTML); }
    document.addEventListener("DOMContentLoaded", () => { document.querySelector("tbody").innerHTML = localStorage.getItem('inv') || ""; });
</script>
</body>
</html>
