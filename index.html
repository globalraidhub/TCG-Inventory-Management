<style>
/* ===== MOBILE-ONLY OVERRIDES — desktop styles above are untouched ===== */
@media (max-width: 768px) {

  /* Prevent iOS auto-zoom on tap by ensuring 16px+ font on all fields */
  input, select, button {
    font-size: 16px !important;
  }

  /* Header stacks and shrinks already handled — reinforce spacing */
  .header-section {
    gap: 10px;
  }

  /* Action buttons: full-width stack instead of a cramped row */
  .action-buttons {
    flex-direction: column;
  }
  .action-buttons .btn {
    width: 100%;
  }

  /* Add-to-stock row: stack every field to full width */
  .inventory-row {
    flex-direction: column;
    align-items: stretch;
  }
  .inventory-row input,
  .inventory-row select {
    width: 100% !important;
    max-width: 100% !important;
  }
  .inventory-row .btn-add,
  .inventory-row .btn-cancel {
    width: 100%;
  }

  /* Filter section: stack full width too */
  .filter-section {
    flex-direction: column;
    align-items: stretch;
  }
  .filter-section select,
  .filter-input {
    width: 100% !important;
    max-width: 100% !important;
    flex: none !important;
  }
  .filter-section .btn-clear-filters {
    width: 100%;
  }

  /* Results bar wraps cleanly */
  .results-bar {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  /* ===== Table -> stacked cards on phones ===== */
  .table-wrap {
    overflow-x: visible;
  }
  #inventory-table {
    min-width: 0;
  }
  #inventory-table thead {
    display: none; /* hide header row, labels come from data-label below */
  }
  #inventory-table, #inventory-table tbody, #inventory-table tr, #inventory-table td {
    display: block;
    width: 100%;
  }
  #inventory-table tr {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 8px 12px;
  }
  #inventory-table td {
    border-bottom: 1px solid #333;
    padding: 8px 4px;
    white-space: normal;
    text-align: left;
    position: relative;
  }
  #inventory-table td:last-child {
    border-bottom: none;
  }
  /* Label each cell using its column header text (requires data-label attr — see JS below) */
  #inventory-table td::before {
    content: attr(data-label);
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 2px;
  }

  /* Modal fits narrow screens */
  .modal {
    width: 88%;
    padding: 20px;
  }

  /* Toasts don't overflow the screen edge */
  #toast-container {
    left: 12px;
    right: 12px;
    bottom: 16px;
  }
  .toast {
    max-width: 100%;
  }
}
</style>

<script>
/* Adds data-label attributes to every table cell so the CSS above can show
   column names on phones. Safe to run on any screen size — it's a no-op
   visually on desktop since the CSS rule only fires under 768px. */
(function attachMobileRowLabels() {
  function labelRows() {
    var table = document.getElementById('inventory-table');
    if (!table) return;
    var headers = Array.prototype.map.call(
      table.querySelectorAll('thead th'),
      function (th) { return th.textContent.trim(); }
    );
    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (row) {
      Array.prototype.forEach.call(row.children, function (cell, i) {
        if (headers[i]) cell.setAttribute('data-label', headers[i]);
      });
    });
  }

  // Re-label whenever the table body changes (new rows added/edited/deleted)
  var target = document.getElementById('inventory-table');
  if (target) {
    var observer = new MutationObserver(labelRows);
    observer.observe(target.querySelector('tbody') || target, { childList: true, subtree: true });
  }
  document.addEventListener('DOMContentLoaded', labelRows);
  labelRows();
})();
</script>
